version: '3.8'

services:
  # Main application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: squad-traffic-analyzer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://squad_analyzer:${DB_PASSWORD:-changeme}@postgres:5432/traffic_analyzer
    volumes:
      - ../data:/app/data
      - ../pcap_captures:/app/pcap_captures
      - ../logs:/app/logs
      - ../.env:/app/.env
    depends_on:
      - redis
      - postgres
    networks:
      - analyzer-network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: squad-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - analyzer-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: squad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: traffic_analyzer
      POSTGRES_USER: squad_analyzer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - analyzer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: squad-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - analyzer-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Prometheus metrics (optional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: squad-prometheus
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - analyzer-network

volumes:
  redis-data:
  postgres-data:

networks:
  analyzer-network:
    driver: bridge
